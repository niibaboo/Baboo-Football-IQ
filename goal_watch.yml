name: Update Goal Watch Report

on:
  schedule:
    # Runs once daily — adjust the hour to whenever you want the freshest form data.
    - cron: '0 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-goal-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # free-tier rate limiting makes a full run take ~10-12 min
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Build Goal Watch report
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python goal_watch.py

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --quiet --cached || git commit -m "Update Goal Watch report $(date -u +%Y-%m-%d)"
          git push
